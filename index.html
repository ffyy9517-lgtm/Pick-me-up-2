<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة Pick Me Up</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0b1020; 
            color: #ffffff;
            font-family: sans-serif;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* 1. شريط الموارد العلوي */
        .game-header {
            height: 65px;
            background-color: #060912;
            border-bottom: 2px solid rgba(79, 195, 247, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .resource-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 90px;
            justify-content: center;
        }

        .resource-icon { font-size: 1.2rem; margin-left: 8px; }
        .resource-value { font-weight: bold; font-size: 1rem; color: #e8eaf6; }

        /* 2. الغرفة الوسطى (مؤقتة) */
        .game-main {
            flex-grow: 1;
            border: 2px dashed #ce93d8; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(206, 147, 216, 0.05);
            margin: 5px 0;
        }

        /* 3. تحديث الغرفة السفلية وتصميم أزرار التحكم */
        .game-footer {
            height: 85px;
            background-color: #060912; /* خلفية داكنة متناسقة */
            border-top: 2px solid rgba(79, 195, 247, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-gap;
            padding: 0 15px;
            box-sizing: border-box;
            gap: 15px; /* مسافة بين الزرين */
        }

        /* التصميم المشترك للأزرار */
        .btn-control {
            flex: 1; /* جعل الزرين متساويين في العرض تماماً */
            height: 50px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* زر المعركة (اللون الهجومي) */
        .btn-battle {
            background: linear-gradient(135deg, #ff7043, #ef5350);
        }

        /* زر الاستدعاء (اللون السحري) */
        .btn-summon {
            background: linear-gradient(135deg, #ce93d8, #4fc3f7);
            color: #060912; /* خط داكن لتباين أفضل */
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="game-header">
            <div class="resource-box">
                <span class="resource-icon">🪙</span>
                <span class="resource-value" id="gold-count">1,500</span>
            </div>
            <div class="resource-box">
                <span class="resource-icon">💎</span>
                <span class="resource-value" id="gem-count">50</span>
            </div>
        </div>

        <div class="game-main">
            <p>⚔️ الغرفة الوسطى (المعارك وبطاقات الأبطال) ⚔️</p>
        </div>

        <div class="game-footer">
            <button class="btn-control btn-battle">
                <span>⚔️</span> معركة
            </button>
            <button class="btn-control btn-summon">
                <span>🔮</span> استدعاء
            </button>
        </div>

    </div>

</body>
</html>
