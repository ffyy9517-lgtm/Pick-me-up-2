<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة Pick Me Up</title>
    
    <style>
        /* إعدادات المتصفح لجعل الصفحة تتصرف كتطبيق هاتف معزول */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* لمنع التمرير الخارجي أو ظهور مساحات بيضاء عند السحب */
            overflow: hidden; 
            /* لون خلفية غامق ومميز للألعاب */
            background-color: #0b1020; 
            color: #ffffff;
            font-family: sans-serif;
        }

        .screen-test {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="screen-test">
        <div>
            <h2>📱 تم تهيئة شاشة الموبايل بنجاح!</h2>
            <p>الخلفية أصبحت غامقة، ومقاس الشاشة محكوم 100% بدون إمكانية التكبير العشوائي.</p>
        </div>
    </div>

</body>
</html>
