<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة Pick Me Up</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0b1020; 
            color: #ffffff;
            font-family: sans-serif;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* 1. تحديث الغرفة العلوية وتصميم شريط الموارد */
        .game-header {
            height: 65px;
            background-color: #060912; /* خلفية داكنة مميزة */
            border-bottom: 2px solid rgba(79, 195, 247, 0.2); /* خط سفلي مضيء خفيف */
            display: flex;
            align-items: center;
            justify-content: space-around; /* توزيع متوازن للموارد */
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* تصميم خانة المورد (الذهب أو الجواهر) */
        .resource-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05); /* خلفية شبه شفافة */
            padding: 6px 14px;
            border-radius: 20px; /* زوايا دائرية ناعمة */
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 90px;
            justify-content: center;
        }

        .resource-icon {
            font-size: 1.2rem;
            margin-left: 8px; /* مسافة بين الأيقونة والرقم */
        }

        .resource-value {
            font-weight: bold;
            font-size: 1rem;
            color: #e8eaf6;
        }

        /* 2. الغرفة الوسطى (مؤقتة بالحدود البنفسجية) */
        .game-main {
            flex-grow: 1;
            border: 2px dashed #ce93d8; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(206, 147, 216, 0.05);
            margin: 5px 0;
        }

        /* 3. الغرفة السفلية (مؤقتة بالحدود الخضراء) */
        .game-footer {
            height: 80px;
            border: 2px dashed #4caf50; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(76, 175, 80, 0.05);
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="game-header">
            <div class="resource-box">
                <span class="resource-icon">🪙</span>
                <span class="resource-value" id="gold-count">1,500</span>
            </div>

            <div class="resource-box">
                <span class="resource-icon">💎</span>
                <span class="resource-value" id="gem-count">50</span>
            </div>
        </div>

        <div class="game-main">
            <p>⚔️ الغرفة الوسطى (المعارك وبطاقات الأبطال) ⚔️</p>
        </div>

        <div class="game-footer">
            <h3>🎮 الغرفة السفلية (أزرار التحكم)</h3>
        </div>

    </div>

</body>
</html>
